<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Salones Agustín Barrón</title>
<link rel="stylesheet" href="app.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:24px;background:var(--fondo)}
  .entrada{
    width:100%;max-width:400px;background:var(--panel);border:1px solid var(--linea);
    border-radius:20px;padding:34px 32px;box-shadow:var(--sombra-2);
    animation:entra .4s var(--ease) both;
  }
  .entrada .titulo-entrada{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px}
  .entrada .sub{font-size:13.5px;color:var(--tinta-3);margin-bottom:26px}
  .entrada label{display:block;font-size:13.5px;font-weight:580;margin-bottom:7px}
  .entrada input{width:100%;padding:12px 13px;font-size:15.5px;border-radius:10px;margin-bottom:16px}
  .entrada button{width:100%;padding:13px;font-size:15.5px;font-weight:620;margin-top:6px}
  .entrada .malo{
    background:var(--ocupada-bg);color:var(--ocupada);padding:11px 14px;border-radius:11px;
    font-size:13.5px;line-height:1.45;margin-bottom:16px;
  }
  .entrada .nota{font-size:12.5px;color:var(--tinta-3);line-height:1.5;margin-top:18px}
  .entrada .paso{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--acento);margin-bottom:10px}
</style>
</head>
<body>
  <form class="entrada" id="caja" autocomplete="on">
    <div class="titulo-entrada">Salones Agustín Barrón</div>
    <div class="sub" id="sub">Entra para ver y mover la agenda.</div>
    <div id="error" hidden></div>
    <div id="campos"></div>
    <button class="primario" type="submit" id="enviar">Entrar</button>
    <div class="nota" id="nota"></div>
  </form>
<script type="module" src="js/entrar.js"></script>
</body>
</html>
